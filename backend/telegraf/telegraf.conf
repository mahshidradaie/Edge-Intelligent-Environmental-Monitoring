[agent]
  interval = "10s"
  flush_interval = "5s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["edgeguard/+/telemetry"]
  data_format = "json"
  name_override = "environment"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "edgeguard/+/telemetry"
    tags = "_/device/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "edgeguard"
  bucket = "telemetry"
