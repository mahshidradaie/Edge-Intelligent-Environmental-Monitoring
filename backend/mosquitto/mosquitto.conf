# DEVELOPMENT configuration: anonymous, plaintext. Do not expose to the internet.
# For production: set allow_anonymous false, add password_file, and add a TLS listener:
#   listener 8883
#   cafile /mosquitto/certs/ca.crt
#   certfile /mosquitto/certs/server.crt
#   keyfile /mosquitto/certs/server.key
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/
